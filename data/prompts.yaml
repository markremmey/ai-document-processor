system_prompt: |
  Examine the Job Category Mappings and the provided job record to categorize the job listing


user_prompt: 
  "Generate the output job classification as previously instructed. Generate a JSON object with the following fields:
   - JobCategoryId: The ID of the job classification.
   - JobCategory: The category that best fits the job listing based on the provided Job Category Mappings.
   - ConfidenceScore: A score between 0 and 1 indicating the confidence level of the categorization.
   
   Ensure that the output is a valid JSON object without any additional text or formatting."