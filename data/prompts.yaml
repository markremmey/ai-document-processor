system_prompt: |
  Examine the sharepoint vendor history and identify if any of fields provided in the current record look anamolous

user_prompt: 
  "Generate the output job classification as previously instructed. Generate a JSON object with the following fields:
   - 'vendor_name': The name of the vendor from the sharepoint history.
   - 'anamoly_assessment': An analysis of whether any fields in the current record appear anamolous compared to the sharepoint vendor history. Provide a brief explanation for your assessment.
   - 'confidence_score': A confidence score (0-100) indicating the reliability of your assessment.
   
   Ensure that the output is a valid JSON object without any additional text or formatting."