[project]
name = "ai-document-processor"
version = "1.0.0"
description = "AI Document Processor - Azure Functions pipeline for document processing with LLMs"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    # Azure Functions
    "azure-functions>=1.21.0",
    "azure-functions-durable>=1.4.0",

    # Azure Services
    "azure-ai-documentintelligence>=1.0.0",
    "azure-ai-textanalytics>=5.2.0",
    "azure-appconfiguration>=1.7.0",
    "azure-appconfiguration-provider>=2.0.0",
    "azure-cosmos>=4.5.0",
    "azure-identity>=1.21.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-storage-blob>=12.25.0",

    # Microsoft Agent Framework
    "agent-framework>=1.0.0b260116",
    "agent-framework-azure-ai>=1.0.0b260116",
    "agent-framework-azure-ai-search>=1.0.0b260116",
    "agent-framework-core>=1.0.0b260116",

    # OpenAI
    "openai>=2.9.0",

    # Document Processing
    "PyMuPDF>=1.26.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",

    # Utilities
    "pydantic>=2.11.0",
    "PyYAML>=6.0.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1.0",
    "ipython>=9.7.0",
    "jupyter_client>=8.6.0",
]

[tool.uv]
# Allow prereleases for agent-framework packages
prerelease = "if-necessary-or-explicit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
